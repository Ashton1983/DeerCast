<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DeerCast">
<meta name="theme-color" content="#141a12">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<title>DeerCast</title>
<style>
  :root {
    --bg: #141a12; --panel: #1f281b; --panel2: #2a3524; --line: #36432f;
    --text: #e8ece3; --muted: #9aa58a; --orange: #e8681c; --orange2: #ff8a3d;
    --buck: #8c6a43; --doe: #6b7f4e; --rut: #4f6d7a; --kill: #3a4733; --gold: #c9a227;
    --good: #8fbf5a; --bad: #c9644a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    -webkit-user-select: none; user-select: none; overscroll-behavior: none; }
  #app { min-height: 100%; padding: calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 16px); max-width: 560px; margin: 0 auto; }
  h1 { font-size: 28px; margin: 6px 0 4px; letter-spacing: -0.3px; }
  h2 { font-size: 20px; margin: 22px 0 8px; }
  h3 { font-size: 15px; margin: 18px 0 6px; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; }
  p { margin: 6px 0; }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }
  .row { display: flex; gap: 10px; align-items: center; }
  .spread { justify-content: space-between; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  button { font: inherit; color: inherit; border: 0; border-radius: 16px; background: var(--panel2); padding: 14px; font-weight: 700; cursor: pointer; touch-action: manipulation; }
  button:active { transform: scale(.97); filter: brightness(1.25); }
  button.big { width: 100%; padding: 20px; font-size: 20px; }
  button.primary { background: var(--orange); color: #fff; }
  button.ghost { background: transparent; border: 1px solid var(--line); }
  button.link { background: none; padding: 6px 0; color: var(--orange2); font-weight: 600; }
  button.sel { background: var(--orange); color: #fff; }
  .card { background: var(--panel); border-radius: 18px; padding: 16px; margin: 10px 0; }
  .topbar { display: flex; justify-content: space-between; align-items: center; min-height: 36px; }
  .pill { font-size: 13px; padding: 4px 10px; border-radius: 999px; background: var(--panel2); color: var(--muted); }
  .pill.warn { background: #4a3218; color: #ffb27a; }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0; }
  .tabs button { padding: 8px 12px; font-size: 14px; border-radius: 999px; font-weight: 600; }
  input[type=text] { width: 100%; font: inherit; font-size: 18px; padding: 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--panel); color: var(--text); -webkit-user-select: text; user-select: text; }
  /* stand screen */
  .stand { display: flex; flex-direction: column; gap: 10px; min-height: calc(100vh - env(safe-area-inset-top) - env(safe-area-inset-bottom) - 28px); }
  .timer { font-size: 15px; color: var(--muted); text-align: center; }
  .timer b { color: var(--text); font-size: 22px; font-variant-numeric: tabular-nums; }
  .tap { position: relative; border-radius: 22px; color: #fff; font-size: 26px; letter-spacing: 1px; min-height: 110px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
  .tap .n { font-size: 14px; font-weight: 600; opacity: .85; letter-spacing: 0; }
  .tap.buck { background: var(--buck); } .tap.doe { background: var(--doe); }
  .tap.rut { background: var(--rut); min-height: 76px; font-size: 19px; }
  .tap.kill { background: var(--kill); min-height: 64px; font-size: 16px; }
  .tap.flash { animation: flash .45s ease-out; }
  @keyframes flash { 0% { box-shadow: 0 0 0 0 rgba(255,255,255,.9); filter: brightness(1.8); } 100% { box-shadow: 0 0 0 18px rgba(255,255,255,0); filter: none; } }
  .label { font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: 1px; margin: 2px 2px -4px; }
  .spacer { flex: 1; }
  .toast { position: fixed; left: 50%; top: calc(env(safe-area-inset-top) + 4px); transform: translateX(-50%); background: #000d; color: #fff; padding: 12px 18px; border-radius: 14px; font-weight: 700; z-index: 50; transition: opacity .3s; pointer-events: none; max-width: 90%; text-align: center; }
  .modal { position: fixed; inset: 0; background: #000b; display: flex; align-items: flex-end; z-index: 40; }
  .sheet { background: var(--panel); width: 100%; max-width: 560px; margin: 0 auto; border-radius: 22px 22px 0 0; padding: 20px 16px calc(env(safe-area-inset-bottom) + 20px); }
  .step { display: flex; gap: 8px; align-items: center; margin: 4px 0 10px; }
  .dot { width: 26px; height: 26px; border-radius: 50%; background: var(--panel2); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; }
  .dot.on { background: var(--orange); }
  /* results */
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .stat { background: var(--panel); border-radius: 14px; padding: 12px 8px; text-align: center; }
  .stat b { display: block; font-size: 24px; }
  .stat span { font-size: 12px; color: var(--muted); }
  .bar { display: grid; grid-template-columns: 1fr 92px; gap: 4px 10px; align-items: center; margin: 9px 0; }
  .bar .name { font-size: 14px; }
  .bar .val { text-align: right; font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .bar .track { grid-column: 1 / -1; height: 9px; background: var(--panel2); border-radius: 6px; overflow: hidden; }
  .bar .fill { height: 100%; background: var(--doe); border-radius: 6px; }
  .bar .fill.hi { background: var(--orange); }
  .bar .meta { grid-column: 1 / -1; font-size: 12px; color: var(--muted); margin-top: -2px; }
  .topc { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 14px; background: var(--panel2); margin: 8px 0; }
  .topc.first { background: var(--orange); color: #fff; }
  .topc .what { font-weight: 700; font-size: 15px; }
  .topc .why { font-size: 12px; opacity: .8; }
  .topc .num { font-weight: 800; font-size: 18px; white-space: nowrap; }
  details { background: var(--panel); border-radius: 14px; padding: 4px 14px; margin: 8px 0; }
  summary { padding: 12px 0; font-weight: 700; list-style: none; cursor: pointer; }
  summary::after { content: "▾"; float: right; color: var(--muted); }
  details[open] summary::after { content: "▴"; }
  .day { display: grid; grid-template-columns: 54px 1fr auto; gap: 10px; align-items: center; padding: 12px; border-radius: 14px; background: var(--panel); margin: 8px 0; }
  .day .date { text-align: center; line-height: 1.1; }
  .day .date b { display: block; font-size: 22px; }
  .day .date span { font-size: 12px; color: var(--muted); }
  .day .score { font-weight: 800; font-size: 18px; text-align: right; }
  .day .why { font-size: 13px; color: var(--muted); }
  .good { color: var(--good); } .bad { color: var(--bad); }
  .hap { position: absolute; opacity: 0; pointer-events: none; width: 1px; height: 1px; }
  .center { text-align: center; }
  .logo { width: 72px; height: 72px; border-radius: 18px; display: block; margin: 18px auto 6px; }
  hr { border: 0; border-top: 1px solid var(--line); margin: 18px 0; }
</style>
</head>
<body>
<div id="app"></div>
<label class="hap" id="hapLabel"><input type="checkbox" switch id="hapInput"></label>
<script src="config.js"></script>
<script src="astro.js"></script>
<script src="analysis.js"></script>
<script src="app.js"></script>
</body>
</html>
